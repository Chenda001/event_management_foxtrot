{% extends 'base.html' %}

{% block title %}Available Spaces{% endblock %}

{% block content %}
<h2 style="text-align:center; margin-top: 20px;">Available Spaces</h2>

<div class="space-list">
  {% for space in spaces %}
    <div class="space-card">
      <h3>{{ space.name }}</h3>
      <p>{{ space.description }}</p>
      <p>Capacity: {{ space.capacity }}</p>
      <a href="{% url 'bookings:book_space' space.id %}" class="btn-book">Book</a>
    </div>
  {% empty %}
    <p>No spaces available at the moment.</p>
  {% endfor %}
</div>

<style>
.space-list {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px;
}

.space-card {
    flex: 1 1 250px;
    max-width: 300px;
    border: 1px solid #ddd;
    padding: 1rem;
    border-radius: 8px;
    background-color: #f9f9f9;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: transform 0.2s ease-in-out;
}

.space-card:hover {
    transform: scale(1.02);
}

.space-card h3 {
    font-size: 1.2rem;
    margin-bottom: 10px;
}

.btn-book {
    display: inline-block;
    margin-top: 10px;
    background-color: #4CAF50;
    color: white;
    padding: 6px 12px;
    border: none;
    border-radius: 5px;
    text-decoration: none;
    transition: background-color 0.2s ease-in-out;
}

.btn-book:hover {
    background-color: #45a049;
}
</style>
{% endblock %}
