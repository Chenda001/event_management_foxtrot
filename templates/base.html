<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Management</title>

<!-- Font Awesome CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #007bff;
    color: white;
    padding: 10px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    float: left;
  }

  nav {
    margin-top: 10px;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
  }

  nav a:hover {
    text-decoration: underline;
  }

  main {
    flex: 1; /* take up all available space */
    padding: 20px;
    text-align: center;
  }

  footer {
    background: rgb(20, 125, 230);
    text-align: center;
    padding: 10px;
    color: white;
  }

  ul {
    list-style: none;
    color: red;
    padding: 0;
  }
</style>
</head>

<body>
<header>
  <h1>Event Management System</h1>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'home' %}">
        <i class="fa-solid fa-house"></i> Home
      </a> |
      <a href="{% url 'logout' %}">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </a>
    {% else %}
      <a href="{% url 'login' %}">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </a> |
      <a href="{% url 'register' %}">
        <i class="fa-solid fa-user-plus"></i> Register
      </a>
    {% endif %}
  </nav>
</header>

{% if messages %}
  <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<main>
  {% block content %}
  {% endblock %}
</main>

<footer>
  &copy; 2025 Event Management
</footer>

</body>
</html>
