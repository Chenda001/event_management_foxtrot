<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Management</title>
</head>
<body>
    <header>
        <h1>Event Management System</h1>
        <nav>
            <a href="{% url 'login' %}">Login</a> |
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </header>

    {% if messages %}
      <ul>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <main>
        {% block content %}
        <!-- page-specific content will appear here -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Event Management</p>
    </footer>
</body>
</html>
