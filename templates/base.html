<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Management</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      padding: 20px;
    }

    footer {
      background: rgb(20, 125, 230);
      text-align: center;
      padding: 10px;
      color: white;
    }

    .navbar-brand i {
      margin-right: 8px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      color: red;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">
      <i class="fa-solid fa-calendar-days"></i> Event Management
    </a>
    <div>
      {% if user.is_authenticated %}
        <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm me-2">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </a>
        <a href="{% url 'register' %}" class="btn btn-outline-light btn-sm">
          <i class="fa-solid fa-user-plus"></i> Register
        </a>
      {% endif %}
    </div>
  </div>
</nav>

<!-- Flash Messages -->
<div class="container mt-3">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
</div>

<!-- Main Content -->
<main class="container">
  {% block content %}
  {% endblock %}
</main>

<!-- Footer -->
<footer>
  &copy; 2025 Event Management
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
