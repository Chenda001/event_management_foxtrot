<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Management</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
  }
  header {
    background: #007bff;
    color: white;
    padding: 10px;
    text-align: center;
  }
  header h1 {
    margin: 0;
  }
  nav {
    margin-top: 10px;
  }
  nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
  }
  nav a:hover {
    text-decoration: underline;
  }
  main {
    padding: 20px;
    text-align: center;
  }
  footer {
    background: #ddd;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
  }
</style>
</head>

<body>
<header>
  <h1>Event Management System</h1>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'home' %}">Home</a> |
      <a href="{% url 'bookings' %}">Bookings</a> |
      <a href="{% url 'events' %}">Events</a> |
      <a href="{% url 'venues' %}">Venues</a> |
      <a href="{% url 'logout' %}">Logout</a>
    {% else %}
      <a href="{% url 'login' %}">Login</a> |
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
</header>

{% if messages %}
  <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<main>
  {% block content %}
  {% endblock %}
</main>

<footer>
  &copy; 2025 Event Management
</footer>
</body>
</html>
