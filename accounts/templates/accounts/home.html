{% extends 'base.html' %}
{% block content %}

<style>
  .home {
    text-align: center;
    margin-top: 50px;
    font-family: Arial, sans-serif;
  }

  .home h2 {
    font-size: 2em;
    color: #007BFF;
    margin-bottom: 20px;
  }

  .home p {
    font-size: 1.2em;
    color: #555;
    margin-bottom: 10px;
  }

  .home a {
    display: inline-block;
    margin: 10px;
    padding: 10px 20px;
    background-color: #007BFF;
    color: white;
    text-decoration: none;
    border-radius: 5px;
  }

  .home a:hover {
    background-color: #0056b3;
  }

  .logout {
    margin-top: 20px;
  }

</style>

<section class="home">
  <h2>Welcome to the Event Management System</h2>
 

  {% if user.is_authenticated %}
    <p>Hello, {{ user.username }}!</p>

    <div class="app-links">
      <a href="{% url 'venue:space_list' %}">Go to Venues</a>
      <a href="{% url 'bookings:booking_list' %}">View Bookings</a>
    </div>


  {% else %}
    <p><a href="{% url 'login' %}">Login</a> or <a href="{% url 'register' %}">Register</a> to get started.</p>
  {% endif %}
</section>

{% endblock %}
