{% extends 'base.html' %}
{% block content %}

<div class="text-center mt-5">
  <h2 class="text-primary mb-3">Welcome to the Event Management System</h2>

  {% if user.is_authenticated %}
    <p class="lead">Hello, {{ user.username }}!</p>

    <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
      <a href="{% url 'venue:space_list' %}" class="btn btn-primary">
        <i class="fa-solid fa-location-dot me-2"></i> Go to Venues
      </a>
      <a href="{% url 'bookings:booking_list' %}" class="btn btn-success">
        <i class="fa-solid fa-calendar-check me-2"></i> View Bookings
      </a>
      <a href="{% url 'event:event_list' %}" class="btn btn-info text-white">
        <i class="fa-solid fa-list me-2"></i> View Events
      </a>
    </div>

  {% else %}
    <p class="lead mt-4">
      <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Login
      </a>
      or
      <a href="{% url 'register' %}" class="btn btn-outline-success ms-2">
        <i class="fa-solid fa-user-plus me-1"></i> Register
      </a>
      to get started.
    </p>
  {% endif %}
</div>

{% endblock %}
