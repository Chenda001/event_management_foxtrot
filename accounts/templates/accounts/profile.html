{% extends 'base.html' %}
{% block content %}

<style>
  .profile-container {
    max-width: 500px;
    margin: 50px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    text-align: center;
  }

  .profile-container h2 {
    color: #007BFF;
    margin-bottom: 20px;
  }

  .profile-container p {
    font-size: 1.1em;
    margin-bottom: 10px;
  }

  .profile-container a {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: #dc3545;
    color: white;
    text-decoration: none;
    border-radius: 4px;
  }

  .profile-container a:hover {
    background: #c82333;
  }
</style>

<div class="profile-container">
  <h2>Welcome {{ user.username }}</h2>
  <p>Your email: {{ user.email }}</p>
  <a href="{% url 'logout' %}">Logout</a>
</div>

{% endblock %}
<footer>
  <p>&copy; 2025 Event Management</p>
