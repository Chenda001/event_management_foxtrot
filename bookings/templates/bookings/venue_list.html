<h2>Venue List</h2>
<ul>
  {% for venue in venues %}
    <li>
      <strong>{{ venue.name }}</strong> — 
      {% if venue.id in booked_ids %}
        <span style="color:red;">Booked</span>
      {% else %}
        <span style="color:green;">Available</span>
      {% endif %}
    </li>
  {% endfor %}
</ul>
